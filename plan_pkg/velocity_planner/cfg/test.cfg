#!/usr/bin/env python
PACKAGE = "velocity_planner"
import roslib; roslib.load_manifest(PACKAGE)
from math import pi
from dynamic_reconfigure.parameter_generator_catkin import *


gen = ParameterGenerator()
# int_t, float_t, str_t, bool_t 
#'name', 'type', 'level', 'description', 'default', 'min', 'max'

gen.add("lag_tau", double_t, 0, "A double parameter",    0.6, 0,   2)
gen.add("Q_vel", double_t, 0, "A double parameter",    10.0, 0.1,   1000)
gen.add("Q_dis", double_t, 0, "A double parameter",    50.0, 0.1,   1000)
gen.add("R_weight", double_t, 0, "A double parameter",    1.0, 0.1,   1000)
gen.add("d_time", double_t, 0, "A double parameter",    2.0, 0.01,   5)
gen.add("d_safe", double_t, 0, "A double parameter",    15.0, 1,   100)
gen.add("max_speed", double_t, 0, "A double parameter",    60, 0.1,   130)
gen.add("Activate", bool_t, 0, "A boolean parameter",    False)
control_mode_enum = gen.enum([
    gen.const("ACC", int_t, 0, "ACC"),
    gen.const("ChangeLane", int_t, 1, "ChangeLane"),
    gen.const("Optimal", int_t, 2, "Optimal"),
    gen.const("GGV", int_t, 3, "GGV"),
], "control_mode")

gen.add("dynamic_control_mode", int_t, 0, "Control Mode",    0, 0,   3, edit_method=control_mode_enum)

exit(gen.generate(PACKAGE, "velocity_planner", "test"))